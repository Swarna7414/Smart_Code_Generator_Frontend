<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Smart Code Generator</title>
    <script>
      // Encode the full path into a query string and redirect to index.html
      // so GitHub Pages serves it, then index.html restores the original URL.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 2).join('/') +
        '/?p=' + encodeURIComponent(
          l.pathname.slice(1) + (l.search ? '&q=' + l.search.slice(1) : '') + l.hash
        )
      );
    </script>
  </head>
  <body></body>
</html>
