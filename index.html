<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="src/assets/LogoImage.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Smart Code Generator</title>

    <link href="https://fonts.googleapis.com/css2?family=Caveat&family=Dancing+Script&family=Gloria+Hallelujah&family=Great+Vibes&family=Pacifico&family=Satisfy&display=swap" rel="stylesheet">

    <script>
      // Restore the original path that was encoded by 404.html
      (function() {
        var p = window.location.search.slice(1);
        if (p.indexOf('p=') === 0) {
          var decoded = decodeURIComponent(p.slice(2).replace(/&q=(.*)/, '?$1'));
          window.history.replaceState(null, null, '/' + decoded);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
